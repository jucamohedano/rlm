[project]
name = "triton-rlm"
version = "0.0.1"
description = "Training a policy to write Triton kernels through the RLM multi-turn harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
]

# Add torch + triton here when the real verifier (compile/run/time) replaces the
# marker-checks in env.py. Keep the package light while you learn the plumbing.

[tool.uv.sources]
rlm-train = { path = "../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triton_rlm"]

[project.entry-points."verifiers.environments"]
triton-rlm = "triton_rlm:load_environment"
